name: Download Food Records

on:
  # Allow manual triggering of the workflow
  workflow_dispatch:
    inputs:
      description:
        description: 'Description of the manual run'
        required: false
        default: 'Manual download of food records'
      save_to_mongo:
        description: 'Save records to MongoDB'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  download-food-records:
    name: Download and Display Food Records
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: make install

    - name: Prepare product artifacts
      run: |
        touch eligible_products.jsonl
        touch non_polish_direct_category_rejections.jsonl
        touch other_rejections.jsonl
        
    - name: Download and display food records
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        SAVE_TO_MONGO: ${{ inputs.save_to_mongo || 'true' }}
      run: |
        if [ -z "${HF_TOKEN:-}" ]; then
          echo "::error::Missing required repository secret: HF_TOKEN"
          exit 1
        fi
        echo "🚀 Starting food records download..."
        if [ "$SAVE_TO_MONGO" = "true" ]; then
          echo "📊 MongoDB storage: ENABLED"
        else
          echo "📊 MongoDB storage: DISABLED"
        fi
        make run
        echo "✅ Food records download completed!"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: food-data-outputs
        path: |
          eligible_products.jsonl
          food_groups_hierarchy.json
          unique_food_groups.json
          categories_hierarchy.json
          categories_hierarchy_with_direct_counts.json
          unique_categories.json
          unique_last_categories.json
          direct_category_product_counts.json
          non_polish_direct_category_rejections.jsonl
          other_rejections.jsonl
        retention-days: 30
        
    - name: Upload run summary
      if: always()
      run: |
        echo "## 🍕 Food Records Download Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Eligible Products**: $(wc -l < eligible_products.jsonl)" >> $GITHUB_STEP_SUMMARY
        echo "🚫 **Non-Polish Category and Name Rejections**: $(wc -l < non_polish_direct_category_rejections.jsonl)" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ **Other Rejections**: $(wc -l < other_rejections.jsonl)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.save_to_mongo || 'true' }}" = "true" ]; then
          echo "💾 **MongoDB Storage**: ENABLED" >> $GITHUB_STEP_SUMMARY
        else
          echo "💾 **MongoDB Storage**: DISABLED" >> $GITHUB_STEP_SUMMARY
        fi
        echo "🔗 **Source**: OpenFoodFacts dataset via Hugging Face" >> $GITHUB_STEP_SUMMARY
        echo "📁 **Artifacts**: All outputs saved as 'food-data-outputs' artifact" >> $GITHUB_STEP_SUMMARY
        echo "  - **Eligible Products**: eligible_products.jsonl" >> $GITHUB_STEP_SUMMARY
        echo "  - **Food Groups Hierarchy**: food_groups_hierarchy.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Unique Food Groups**: unique_food_groups.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Categories Hierarchy**: categories_hierarchy.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Categories Hierarchy with Direct Counts**: categories_hierarchy_with_direct_counts.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Unique Categories**: unique_categories.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Direct Category Product Counts**: direct_category_product_counts.json" >> $GITHUB_STEP_SUMMARY
        echo "  - **Language Rejections**: non_polish_direct_category_rejections.jsonl" >> $GITHUB_STEP_SUMMARY
        echo "  - **Other Rejections**: other_rejections.jsonl" >> $GITHUB_STEP_SUMMARY
        echo "⏰ **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
